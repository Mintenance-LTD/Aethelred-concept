name: Python quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check, test, and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aethelred
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aethelred/pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Static type check
        run: mypy src

      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Verify package can be built
        run: python -m pip wheel --no-deps --wheel-dir dist .
