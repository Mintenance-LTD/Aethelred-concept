[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aethelred"
version = "0.1.0"
description = "Adaptive Autonomous Swarm Intelligence System - The Divine General"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "gymnasium>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "numpy>=1.26.0,<2.5",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "tensorboard>=2.15.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aethelred"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_configs = true
