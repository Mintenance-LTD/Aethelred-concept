device: cpu
checkpoint_dir: checkpoints/policy_authority_shaped
simulation:
  max_steps: 200
  physics: {hit_probability_base: 0.7, damage_per_hit: 0.6}
  threats: {initial_threats: 5, max_threats: 8, spawn_interval: 40, default_profile: random_mix}
  swarm: {autonomy_enabled: false}        # policy is the sole driver
  # Same as config.yaml but with a dense per-step shaping reward for damage dealt
  # to threats (threat_damage). This densifies the sparse kill signal WITHOUT
  # encoding which threat to engage — engaging the deadly AA still nets negative
  # once its loss penalty lands, so state-dependence must still be learned.
  reward_weights: {survival: 0.1, threat_neutralized: 4.0, threat_damage: 3.0, loss_penalty: 3.0, mission_progress: 0.0, efficiency: 0.0, adaptation_bonus: 0.0}
training: {update_interval: 512, learning_rate: 0.0005, entropy_coef: 0.05, aux_coef: 1.0, center_advantages: false, warmup_steps: 40, total_training_steps: 800}
